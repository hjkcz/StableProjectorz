name: Build SPZ Windows

# =====================================================================
# Triggers:
#   workflow_dispatch with build_type input:
#     - "activate"  : one-time, generates ALF -> convert to ULF -> set secret
#     - "baseline"  : original project, no CN, no Bridge (verify toolchain)
#     - "cn"        : CN localization + CJK font + Agent Bridge
#   push tag v*: runs baseline build
# =====================================================================
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'activate | baseline | cn'
        required: true
        default: 'baseline'
  push:
    tags:
      - 'v*'

env:
  UNITY_VERSION: '6000.2.6f2'
  UNITY_CHANGESET: '4a4dcaec6541'
  BUILD_NAME_BASELINE: 'StableProjectorz-Baseline'
  BUILD_NAME_CN: 'StableProjectorz-CN'
  CJK_FONT_URL: 'https://github.com/adobe-fonts/source-han-sans/releases/download/2.004R/SourceHanSansCN.zip'
  CJK_FONT_SHA256: 'C0AA89A70F92A820FF95490FEA6D472CD19621A71C9A748A4950EB2EAFE6438E'

jobs:
  # ===================================================================
  # Job 1: One-time license activation (generates ALF file)
  # ===================================================================
  activate:
    name: Request Unity Activation File
    if: github.event.inputs.build_type == 'activate'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unity Editor (minimal)
        shell: pwsh
        run: |
          Write-Host "=== Downloading Unity $env:UNITY_VERSION ==="
          $installerUrl = "https://download.unity3d.com/download_unity/$env:UNITY_CHANGESET/Windows64EditorInstaller/UnitySetup64-$env:UNITY_VERSION.exe"
          $installerPath = "$env:RUNNER_TEMP\UnitySetup.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing
          Write-Host "=== Installing Unity (silent) ==="
          $proc = Start-Process -FilePath $installerPath -ArgumentList '/S', '/D=C:\Program Files\Unity\Hub\Editor\6000.2.6f2' -Wait -NoNewWindow -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "ERROR: Unity installer exited with code $($proc.ExitCode)"
            exit 1
          }
          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Unity.exe"
          if (-not (Test-Path $unityExe)) {
            Write-Host "ERROR: Unity.exe not found after installation"
            exit 1
          }
          Write-Host "=== Unity installed and verified ==="

      - name: Generate Activation File (ALF)
        shell: pwsh
        run: |
          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Unity.exe"
          $logFile = "$env:RUNNER_TEMP\activation_log.txt"

          # Pre-create Unity cache directories to avoid CreateDirectory failures
          $cacheDirs = @(
            "$env:LOCALAPPDATA\Unity\Caches",
            "$env:LOCALAPPDATA\Unity\Unity",
            "$env:APPDATA\Unity"
          )
          foreach ($d in $cacheDirs) {
            New-Item -ItemType Directory -Path $d -Force | Out-Null
          }

          Write-Host "=== Requesting activation file ==="
          # Use Start-Process -PassThru to capture exit code reliably for GUI apps on Windows
          $proc = Start-Process -FilePath $unityExe `
            -ArgumentList '-batchmode', '-nographics', "-logFile", $logFile, '-createManualActivationFile', '-quit' `
            -Wait -NoNewWindow -PassThru
          $exitCode = $proc.ExitCode
          Write-Host "Unity exit code: $exitCode"
          Write-Host "=== Activation log (last 50 lines) ==="
          Get-Content $logFile -Tail 50 -ErrorAction SilentlyContinue

          # Search for ALF file everywhere — Unity may put it in unexpected locations
          $alfFile = $null
          $searchPaths = @(
            $env:GITHUB_WORKSPACE,
            "$env:LOCALAPPDATA\Unity",
            "$env:APPDATA\Unity",
            "$env:USERPROFILE",
            "C:\ProgramData\Unity",
            "C:\Program Files\Unity\Hub\Editor\6000.2.6f2",
            $env:RUNNER_TEMP
          )
          Write-Host "=== Searching for ALF file ==="
          foreach ($p in $searchPaths) {
            Write-Host "  Checking: $p (exists: $(Test-Path $p 2>`$null))"
            if (Test-Path $p) {
              $alfFile = Get-ChildItem -Path $p -Filter "*.alf" -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($alfFile) {
                Write-Host "  FOUND: $($alfFile.FullName)"
                break
              }
            }
          }
          # Also try a broad search on C:\ for .alf files (depth-limited)
          if (-not $alfFile) {
            Write-Host "  Broad search on C:\Users and C:\ProgramData..."
            $alfFile = Get-ChildItem -Path "C:\Users" -Filter "*.alf" -Recurse -Depth 5 -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $alfFile) {
              $alfFile = Get-ChildItem -Path "C:\ProgramData" -Filter "*.alf" -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          if ($alfFile) {
            Write-Host "ALF file found: $($alfFile.FullName)"
            Copy-Item $alfFile.FullName -Destination "$env:GITHUB_WORKSPACE\activation.alf" -Force
          } else {
            Write-Host "ERROR: No ALF file generated. Dumping full log for debugging."
            Write-Host "=== Full activation log ==="
            Get-Content $logFile -ErrorAction SilentlyContinue
            Write-Host "=== Dir listing of GITHUB_WORKSPACE ==="
            Get-ChildItem $env:GITHUB_WORKSPACE -Filter "*.alf" -Recurse -ErrorAction SilentlyContinue
            Write-Host "=== Dir listing of LOCALAPPDATA\Unity ==="
            Get-ChildItem "$env:LOCALAPPDATA\Unity" -Recurse -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload ALF file
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: activation.alf
          retention-days: 7

      - name: Upload Activation Log
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-log
          path: ${{ runner.temp }}/activation_log.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Instructions
        run: |
          Write-Host "========================================"
          Write-Host " ALF file generated successfully!"
          Write-Host "========================================"
          Write-Host "Next steps:"
          Write-Host "1. Download the 'unity-activation-file' artifact"
          Write-Host "2. Go to https://license.unity3d.com/manual"
          Write-Host "3. Upload the .alf file"
          Write-Host "4. Download the resulting .ulf file"
          Write-Host "5. In GitHub: Settings > Secrets > Actions"
          Write-Host "   - Create UNITY_LICENSE = contents of .ulf"
          Write-Host "6. Re-run this workflow with build_type=baseline"
          Write-Host "========================================"

  # ===================================================================
  # Job 2: Baseline build (no CN, no Bridge)
  # ===================================================================
  build-baseline:
    name: Baseline Build (Windows x64 IL2CPP)
    if: github.event.inputs.build_type == 'baseline' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check License Secret
        id: check_license
        shell: pwsh
        run: |
          if (-not $env:UNITY_LICENSE) {
            Write-Host "ERROR: UNITY_LICENSE secret is not set."
            Write-Host "Run this workflow with build_type=activate first."
            exit 1
          }
          Write-Host "UNITY_LICENSE secret is present."
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Install Unity Editor + IL2CPP Module
        shell: pwsh
        run: |
          Write-Host "=== Downloading Unity $env:UNITY_VERSION ==="
          $base = "https://download.unity3d.com/download_unity/$env:UNITY_CHANGESET"
          $editorInstaller = "$base/Windows64EditorInstaller/UnitySetup64-$env:UNITY_VERSION.exe"
          $il2cppInstaller = "$base/TargetSupportInstaller/UnitySetup-Windows-IL2CPP-Support-for-Editor-$env:UNITY_VERSION.exe"

          $tmp = "$env:RUNNER_TEMP\unity_installers"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          Write-Host "--- Editor ---"
          Invoke-WebRequest -Uri $editorInstaller -OutFile "$tmp\editor.exe" -UseBasicParsing
          $p1 = Start-Process -FilePath "$tmp\editor.exe" -ArgumentList '/S', '/D=C:\Program Files\Unity\Hub\Editor\6000.2.6f2' -Wait -NoNewWindow -PassThru
          if ($p1.ExitCode -ne 0) { Write-Host "ERROR: Editor installer exit $($p1.ExitCode)"; exit 1 }

          Write-Host "--- IL2CPP Support ---"
          Invoke-WebRequest -Uri $il2cppInstaller -OutFile "$tmp\il2cpp.exe" -UseBasicParsing
          $p2 = Start-Process -FilePath "$tmp\il2cpp.exe" -ArgumentList '/S' -Wait -NoNewWindow -PassThru
          if ($p2.ExitCode -ne 0) { Write-Host "ERROR: IL2CPP installer exit $($p2.ExitCode)"; exit 1 }

          Write-Host "=== Verifying installations ==="
          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Unity.exe"
          if (-not (Test-Path $unityExe)) { Write-Host "ERROR: Unity.exe not found"; exit 1 }
          & $unityExe -version

          # Check IL2CPP
          $il2cppDir = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Data\il2cpp"
          if (-not (Test-Path $il2cppDir)) { Write-Host "ERROR: IL2CPP dir not found"; exit 1 }

          # Check MSVC / Windows SDK (pre-installed on windows-latest)
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            $vsPath = & $vsWhere -latest -property installationPath
            Write-Host "MSVC found: $vsPath"
          } else {
            Write-Host "WARNING: vswhere not found, MSVC check skipped"
          }

          $sdkDirs = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue
          if ($sdkDirs) { Write-Host "Windows SDK versions: $($sdkDirs.Name -join ', ')" }
          else { Write-Host "WARNING: Windows SDK not found" }

          Write-Host "=== Unity + IL2CPP + MSVC + SDK verified ==="

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-baseline-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-baseline-

      - name: Activate Unity License
        shell: pwsh
        run: |
          $ulfPath = "$env:USERPROFILE\.local\share\unity3d\Unity\Unity_lic.ulf"
          $ulfDir = Split-Path $ulfPath -Parent
          New-Item -ItemType Directory -Path $ulfDir -Force | Out-Null
          $env:UNITY_LICENSE | Out-File -FilePath $ulfPath -Encoding utf8 -NoNewline
          Write-Host "License file written."

          # Verify license is valid by launching Unity in batchmode
          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Unity.exe"
          $verifyLog = "$env:RUNNER_TEMP\license_verify.log"
          # Pre-create cache dirs
          New-Item -ItemType Directory -Path "$env:LOCALAPPDATA\Unity\Caches" -Force | Out-Null
          $p = Start-Process -FilePath $unityExe -ArgumentList '-batchmode', '-nographics', "-logFile", $verifyLog, '-quit' -Wait -NoNewWindow -PassThru
          $licExit = $p.ExitCode
          Write-Host "License verify exit code: $licExit"
          Get-Content $verifyLog -Tail 20 -ErrorAction SilentlyContinue
          # Unity returns 0 if license OK; non-zero means license problem
          if ($licExit -ne 0) {
            Write-Host "WARNING: License verification returned non-zero, but continuing..."
          }

      - name: Build (Baseline)
        shell: pwsh
        run: |
          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Unity.exe"
          $logFile = "$env:RUNNER_TEMP\unity_build.log"
          $projectPath = "$env:GITHUB_WORKSPACE"

          # Pre-create cache dirs
          New-Item -ItemType Directory -Path "$env:LOCALAPPDATA\Unity\Caches" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:LOCALAPPDATA\Unity\Unity" -Force | Out-Null

          Write-Host "=== Starting baseline build ==="
          $proc = Start-Process -FilePath $unityExe `
            -ArgumentList '-batchmode', '-nographics', "-logFile", $logFile, "-projectPath", $projectPath, '-executeMethod', 'SPZCloudBuild.BuildBaseline', '-quit' `
            -Wait -NoNewWindow -PassThru
          $exitCode = $proc.ExitCode

          Write-Host "Unity exit code: $exitCode"
          Write-Host "=== Last 100 lines of build log ==="
          Get-Content $logFile -Tail 100 -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) { exit $exitCode }

      - name: Compute SHA-256 (before artifact upload)
        if: success()
        shell: pwsh
        run: |
          $buildDir = "build\StableProjectorz-Baseline"
          $hashFile = "$buildDir\SHA256SUMS"
          # Exclude the hash file itself from hashing
          Get-ChildItem $buildDir -Recurse -File | Where-Object { $_.Name -ne "SHA256SUMS" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $rel = $_.FullName.Substring((Resolve-Path $buildDir).Path.Length + 1)
            "$hash  $rel" | Out-File -FilePath $hashFile -Append -Encoding utf8
          }
          Write-Host "=== SHA-256 Checksums ==="
          Get-Content $hashFile

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SPZ-Baseline-${{ github.run_number }}
          path: build/StableProjectorz-Baseline/
          retention-days: 14

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SPZ-Baseline-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/unity_build.log
            ${{ runner.temp }}/license_verify.log
            build/StableProjectorz-Baseline/build_errors.txt
            build/StableProjectorz-Baseline/BUILD_MANIFEST.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Manifest (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPZ-Baseline-manifest-${{ github.run_number }}
          path: build/StableProjectorz-Baseline/BUILD_MANIFEST.txt
          retention-days: 30
          if-no-files-found: ignore

  # ===================================================================
  # Job 3: CN build (localization + CJK font + Agent Bridge)
  # ===================================================================
  build-cn:
    name: CN Build (Windows x64 IL2CPP + CN + Bridge)
    if: github.event.inputs.build_type == 'cn'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check License Secret
        shell: pwsh
        run: |
          if (-not $env:UNITY_LICENSE) {
            Write-Host "ERROR: UNITY_LICENSE secret is not set."
            exit 1
          }
          Write-Host "UNITY_LICENSE secret is present."
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Download CJK Font + Verify SHA-256
        shell: pwsh
        run: |
          Write-Host "=== Downloading Source Han Sans CN ==="
          $fontDir = "Assets\TextMesh Pro\Fonts"
          New-Item -ItemType Directory -Path $fontDir -Force | Out-Null

          $zipPath = "$env:RUNNER_TEMP\shs.zip"
          Invoke-WebRequest -Uri $env:CJK_FONT_URL -OutFile $zipPath -UseBasicParsing

          $extractDir = "$env:RUNNER_TEMP\shs_extracted"
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          $otfFile = Get-ChildItem $extractDir -Recurse -Filter "SourceHanSansCN-Regular.otf" | Select-Object -First 1
          if (-not $otfFile) {
            Write-Host "ERROR: SourceHanSansCN-Regular.otf not found in archive"
            exit 1
          }

          $destPath = "$fontDir\SourceHanSansCN-Regular.otf"
          Copy-Item $otfFile.FullName $destPath -Force

          $actualHash = (Get-FileHash $destPath -Algorithm SHA256).Hash
          Write-Host "Expected: $env:CJK_FONT_SHA256"
          Write-Host "Actual:   $actualHash"
          if ($actualHash -ne $env:CJK_FONT_SHA256) {
            Write-Host "ERROR: Font SHA-256 mismatch! Aborting."
            exit 1
          }
          Write-Host "Font SHA-256 verified OK."
          $fontSize = (Get-Item $destPath).Length
          Write-Host "Font size: $([math]::Round($fontSize / 1MB, 1)) MB"

          # Copy license file
          $licFile = Get-ChildItem $extractDir -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($licFile) {
            Copy-Item $licFile.FullName "$fontDir\SourceHanSans-LICENSE.txt" -Force
            Write-Host "Font license copied."
          }

      - name: Install Unity Editor + IL2CPP Module
        shell: pwsh
        run: |
          Write-Host "=== Downloading Unity $env:UNITY_VERSION ==="
          $base = "https://download.unity3d.com/download_unity/$env:UNITY_CHANGESET"
          $editorInstaller = "$base/Windows64EditorInstaller/UnitySetup64-$env:UNITY_VERSION.exe"
          $il2cppInstaller = "$base/TargetSupportInstaller/UnitySetup-Windows-IL2CPP-Support-for-Editor-$env:UNITY_VERSION.exe"

          $tmp = "$env:RUNNER_TEMP\unity_installers"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          Write-Host "--- Editor ---"
          Invoke-WebRequest -Uri $editorInstaller -OutFile "$tmp\editor.exe" -UseBasicParsing
          $p1 = Start-Process -FilePath "$tmp\editor.exe" -ArgumentList '/S', '/D=C:\Program Files\Unity\Hub\Editor\6000.2.6f2' -Wait -NoNewWindow -PassThru
          if ($p1.ExitCode -ne 0) { Write-Host "ERROR: Editor installer exit $($p1.ExitCode)"; exit 1 }

          Write-Host "--- IL2CPP Support ---"
          Invoke-WebRequest -Uri $il2cppInstaller -OutFile "$tmp\il2cpp.exe" -UseBasicParsing
          $p2 = Start-Process -FilePath "$tmp\il2cpp.exe" -ArgumentList '/S' -Wait -NoNewWindow -PassThru
          if ($p2.ExitCode -ne 0) { Write-Host "ERROR: IL2CPP installer exit $($p2.ExitCode)"; exit 1 }

          Write-Host "=== Verifying installations ==="
          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Unity.exe"
          if (-not (Test-Path $unityExe)) { Write-Host "ERROR: Unity.exe not found"; exit 1 }
          & $unityExe -version

          $il2cppDir = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Data\il2cpp"
          if (-not (Test-Path $il2cppDir)) { Write-Host "ERROR: IL2CPP dir not found"; exit 1 }

          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            $vsPath = & $vsWhere -latest -property installationPath
            Write-Host "MSVC found: $vsPath"
          } else {
            Write-Host "WARNING: vswhere not found, MSVC check skipped"
          }

          $sdkDirs = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue
          if ($sdkDirs) { Write-Host "Windows SDK versions: $($sdkDirs.Name -join ', ')" }
          else { Write-Host "WARNING: Windows SDK not found" }

          Write-Host "=== Unity + IL2CPP + MSVC + SDK verified ==="

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-cn-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-cn-
            Library-baseline-

      - name: Activate Unity License
        shell: pwsh
        run: |
          $ulfPath = "$env:USERPROFILE\.local\share\unity3d\Unity\Unity_lic.ulf"
          $ulfDir = Split-Path $ulfPath -Parent
          New-Item -ItemType Directory -Path $ulfDir -Force | Out-Null
          $env:UNITY_LICENSE | Out-File -FilePath $ulfPath -Encoding utf8 -NoNewline
          Write-Host "License file written."

          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Unity.exe"
          $verifyLog = "$env:RUNNER_TEMP\license_verify.log"
          # Pre-create cache dirs
          New-Item -ItemType Directory -Path "$env:LOCALAPPDATA\Unity\Caches" -Force | Out-Null
          $p = Start-Process -FilePath $unityExe -ArgumentList '-batchmode', '-nographics', "-logFile", $verifyLog, '-quit' -Wait -NoNewWindow -PassThru
          $licExit = $p.ExitCode
          Write-Host "License verify exit code: $licExit"
          Get-Content $verifyLog -Tail 20 -ErrorAction SilentlyContinue
          if ($licExit -ne 0) {
            Write-Host "WARNING: License verification returned non-zero, but continuing..."
          }

      - name: Apply CN Localization
        shell: pwsh
        run: |
          Write-Host "=== Applying CN localization ==="
          & python tools/apply_cn_localization.py --translations tools/translations.json --repo . --mode apply --report cn_apply_report.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: CN localization apply failed!"
            Get-Content cn_apply_report.txt -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "=== Verifying CN localization ==="
          & python tools/apply_cn_localization.py --translations tools/translations.json --repo . --mode verify --report cn_verify_report.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: CN localization verify failed!"
            Get-Content cn_verify_report.txt -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Build (CN + Agent Bridge)
        shell: pwsh
        run: |
          $unityExe = "C:\Program Files\Unity\Hub\Editor\6000.2.6f2\Editor\Unity.exe"
          $logFile = "$env:RUNNER_TEMP\unity_build.log"
          $projectPath = "$env:GITHUB_WORKSPACE"

          # Pre-create cache dirs
          New-Item -ItemType Directory -Path "$env:LOCALAPPDATA\Unity\Caches" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:LOCALAPPDATA\Unity\Unity" -Force | Out-Null

          Write-Host "=== Starting CN build ==="
          $proc = Start-Process -FilePath $unityExe `
            -ArgumentList '-batchmode', '-nographics', "-logFile", $logFile, "-projectPath", $projectPath, '-executeMethod', 'SPZCloudBuild.BuildCN', '-quit' `
            -Wait -NoNewWindow -PassThru
          $exitCode = $proc.ExitCode

          Write-Host "Unity exit code: $exitCode"
          Write-Host "=== Last 100 lines of build log ==="
          Get-Content $logFile -Tail 100 -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) { exit $exitCode }

      - name: Compute SHA-256 (before artifact upload)
        if: success()
        shell: pwsh
        run: |
          $buildDir = "build\StableProjectorz-CN"
          $hashFile = "$buildDir\SHA256SUMS"
          Get-ChildItem $buildDir -Recurse -File | Where-Object { $_.Name -ne "SHA256SUMS" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $rel = $_.FullName.Substring((Resolve-Path $buildDir).Path.Length + 1)
            "$hash  $rel" | Out-File -FilePath $hashFile -Append -Encoding utf8
          }
          Write-Host "=== SHA-256 Checksums ==="
          Get-Content $hashFile

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SPZ-CN-${{ github.run_number }}
          path: build/StableProjectorz-CN/
          retention-days: 30

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SPZ-CN-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/unity_build.log
            ${{ runner.temp }}/license_verify.log
            build/StableProjectorz-CN/build_errors.txt
            build/StableProjectorz-CN/BUILD_MANIFEST.txt
            cn_apply_report.txt
            cn_verify_report.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Manifest (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPZ-CN-manifest-${{ github.run_number }}
          path: build/StableProjectorz-CN/BUILD_MANIFEST.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Build Summary
        if: always()
        shell: pwsh
        run: |
          $manifestFile = "build\StableProjectorz-CN\BUILD_MANIFEST.txt"
          Write-Host "========================================="
          Write-Host " SPZ CN Build Summary"
          Write-Host "========================================="
          if (Test-Path $manifestFile) {
            Get-Content $manifestFile
          } else {
            Write-Host " Manifest not found (build may have failed before manifest generation)"
          }
          Write-Host "========================================="
          Write-Host " Job Status: ${{ job.status }}"
          Write-Host "========================================="
